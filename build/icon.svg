<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- kage's mark: an agent's face, as the roster draws them, on the accent. The squircle is the 824px of Apple's
       1024 icon grid, so it sits with the other apps in the Dock. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ad8dfd"/>
      <stop offset="1" stop-color="#6443cc"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2a1570" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- The face: a soft rounded body, like the gaze avatars, eyes looking toward the work. -->
  <path filter="url(#shadow)" fill="url(#face)"
    d="M512 262 C676 262 762 360 762 520 C762 690 668 772 512 772 C356 772 262 690 262 520 C262 360 348 262 512 262 Z"/>
  <ellipse cx="452" cy="530" rx="38" ry="52" fill="#202030"/>
  <ellipse cx="602" cy="530" rx="38" ry="52" fill="#202030"/>
  <circle cx="466" cy="510" r="11" fill="#ffffff"/>
  <circle cx="616" cy="510" r="11" fill="#ffffff"/>
</svg>
