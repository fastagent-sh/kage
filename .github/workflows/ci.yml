name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a push run on main: its conclusion is the required status for that commit.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-checks:
    # Stable check name: main's branch protection requires it (.github/main-protection.json); no OS matrix.
    name: Desktop checks
    # The smoke step launches a real Electron window; a Linux runner would need xvfb and no sandbox, which we do not ship.
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out kage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # FastAgent is an exact version in package.json and the lockfile, installed from npm.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck and build the Electron application
        run: npm run build

      - name: Electron local-workflow smoke (isolated fake provider)
        run: node tests/smoke.mjs

      - name: Electron live transcript (isolated fake model endpoint)
        run: node tests/transcript.mjs

      - name: Electron quit with a run in progress (isolated fake model endpoint)
        run: node tests/quit.mjs

      - name: Electron secrets a program declares (isolated fake model endpoint)
        run: node tests/secrets.mjs

      - name: Keep failed smoke screenshot
        if: ${{ failure() && hashFiles('out/smoke-failure.png') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke-failure
          path: out/smoke-failure.png
          if-no-files-found: error
          retention-days: 7

  package:
    # The installed app, checked as someone gets it: built, copied out of the checkout, run. Unsigned (ad-hoc) until
    # there is an Apple Developer ID; the dmg is kept as an artifact.
    name: Package (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out kage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the app and its dmg
        run: npm run package

      - name: Packaged app (outside the checkout, isolated fake model endpoint)
        run: node tests/packaged.mjs

      - name: Keep the dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kage-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
