name: Release

# A failed build leaves no Release, so the latest always has a dmg. The release environment is the manual gate;
# the job checks the tag is the package's version on a commit on main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build the app and draft the release
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the draft release and attach its assets
    defaults:
      run:
        shell: bash
    steps:
      # The commit the tag pointed to when it was pushed, not the tag as it is when a run is re-run.
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag points to a commit on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "release tag must point to a commit on main" >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check that the tag is the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'const want = "v" + require("./package.json").version; if (process.env.TAG !== want) { console.error("release tag " + process.env.TAG + " does not match " + want); process.exit(1) }'

      - name: Test
        run: npm test

      - name: Build the app and its dmg
        run: npm run package

      - name: Packaged app (outside the checkout, isolated fake model endpoint)
        run: node tests/packaged.mjs

      - name: Create the draft release with the dmg and its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          dmg="duang-${TAG#v}-arm64.dmg"
          cd dist
          shasum -a 256 "$dmg" > "$dmg.sha256"
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes "$dmg" "$dmg.sha256"
