name: Bug report
description: A desktop interaction, runtime operation or recovery path is broken.
title: 'bug: '
type: Bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never attach auth.json, API keys, OAuth tokens or private session/project contents.
        Redact logs and screenshots. For sensitive reports, follow SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you try to do, and what happened instead? Preserve the original error after redacting secrets.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include whether this was a new/history conversation, a running/background task, or a navigation/retry operation.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Send/switch/stop ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and CPU architecture, kage commit/version, Electron version, FastAgent revision, and proxy/direct connection. For development, include Node and npm versions.
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model and authentication context
      description: If relevant, name the agent default model, actual conversation model, provider, and authentication source (file path/type only, never contents). Was OAuth refresh involved?
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and impact
      description: Relevant logs/screenshots and whether a draft, history, file or running task was affected. Link an existing milestone interaction if known.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and private conversation/project contents from this report.
          required: true
