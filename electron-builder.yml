# Unsigned until there is an Apple Developer ID: a first open needs Privacy & Security → Open Anyway.
# app.asar ships `dependencies` only; the renderer is bundled by Vite. electron-builder leaves out a package's
# peers, so tests/packaged.mjs checks the bundle for any module a bundled package needs and lacks.
appId: sh.fastagent.duang
productName: duang
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - LICENSE
  - LICENSE-MIT
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  # Ad-hoc signing: Apple silicon requires it to run at all.
  identity: "-"
  hardenedRuntime: false
dmg:
  writeUpdateInfo: false
